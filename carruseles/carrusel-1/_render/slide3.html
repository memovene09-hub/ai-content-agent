<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body { background: #131f3c; color: #fff; font-family: 'Inter', sans-serif; position: relative; padding: 80px 80px 70px 80px; display: flex; flex-direction: column; }
  .header { border-bottom: 2px solid #693f8c; padding-bottom: 28px; margin-bottom: 56px; display: flex; justify-content: space-between; align-items: center; }
  .header-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 4px; text-transform: uppercase; color: #fff; }
  .header-brand-mark img { height: 52px; width: auto; display: block; }
  .bullets { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .bullet { display: flex; align-items: flex-start; gap: 32px; padding: 32px 0; border-bottom: 1px solid rgba(189, 185, 215, 0.18); }
  .bullet:last-child { border-bottom: none; }
  .bullet .dot { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: #693f8c; margin-top: 14px; }
  .bullet .text { font-family: 'Fraunces', serif; font-weight: 700; font-size: 52px; line-height: 1.15; color: #fff; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-label">POR QUÉ IMPORTA</div>
    <div class="header-brand-mark"><img src="file:///C:/Users/jgvs2/OneDrive/Escritorio/claryon-agents/ai-content-agent/references/claryon-logo.png" alt="Claryon"></div>
  </div>
  <div class="bullets">
    <div class="bullet"><div class="dot"></div><div class="text">Respuestas automáticas 24/7, sin intervención humana.</div></div>
    <div class="bullet"><div class="dot"></div><div class="text">Tiempo de atención de horas a segundos.</div></div>
    <div class="bullet"><div class="dot"></div><div class="text">Más ventas cerradas sin contratar más personal.</div></div>
  </div>
</body>
</html>
