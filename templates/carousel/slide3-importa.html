<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body {
    background: #131f3c;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    position: relative;
    padding: 80px 80px 70px 80px;
    display: flex;
    flex-direction: column;
  }
  .header {
    border-bottom: 2px solid #693f8c;
    padding-bottom: 28px;
    margin-bottom: 56px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .header-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffffff;
  }
  .header-brand-mark img {
    height: 42px;
    width: auto;
    display: block;
  }
  .header-brand-mark .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 36px;
    color: #693f8c;
    letter-spacing: 1px;
  }
  .bullets {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
  }
  .bullet {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    padding: 32px 0;
    border-bottom: 1px solid rgba(189, 185, 215, 0.18);
  }
  .bullet:last-child { border-bottom: none; }
  .bullet .dot {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #693f8c;
    margin-top: 14px;
  }
  .bullet .text {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1.15;
    color: #ffffff;
  }
  .bullet .brand-inline {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    vertical-align: middle;
  }
  .bullet .brand-inline img {
    height: 44px;
    width: auto;
    display: inline-block;
    vertical-align: middle;
  }
  .footer-brands {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(189, 185, 215, 0.18);
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .footer-brands .label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bdb9d7;
  }
  .footer-brands img {
    height: 40px;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-label">{{LABEL_POR_QUE_IMPORTA}}</div>
    <div class="header-brand-mark">{{BRAND_MARK_HTML}}</div>
  </div>
  <div class="bullets">
    <div class="bullet"><div class="dot"></div><div class="text">{{BULLET_1_HTML}}</div></div>
    <div class="bullet"><div class="dot"></div><div class="text">{{BULLET_2_HTML}}</div></div>
    <div class="bullet"><div class="dot"></div><div class="text">{{BULLET_3_HTML}}</div></div>
  </div>
  {{FOOTER_BRANDS_HTML}}
</body>
</html>
