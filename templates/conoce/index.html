<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: #131f3c url("../../outputs/claryon/_plate-conoce-4.png") center / cover no-repeat;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .veil-edges {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at center,
        rgba(19,31,60,0) 0%,
        rgba(19,31,60,0) 55%,
        rgba(19,31,60,0.45) 100%);
    pointer-events: none;
  }
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 140px 110px;
    z-index: 2;
  }
  .logo {
    width: 620px;
    height: auto;
    margin-bottom: 64px;
    filter: drop-shadow(0 6px 28px rgba(105,63,140,0.30))
            drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  .rule {
    width: 80px;
    height: 2px;
    background: #693f8c;
    margin-bottom: 44px;
    box-shadow: 0 0 12px rgba(105,63,140,0.55);
  }
  .claim {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 38px;
    line-height: 1.32;
    letter-spacing: 0.3px;
    color: #ffffff;
    text-align: center;
    margin-bottom: 38px;
  }
  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.55;
    letter-spacing: 0.4px;
    color: #bdb9d7;
    text-align: center;
  }
  .corner {
    position: absolute;
    bottom: 52px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(189,185,215,0.55);
    z-index: 2;
  }
  .corner .dot {
    color: #693f8c;
    margin: 0 10px;
  }
</style>
</head>
<body>
  <div class="veil-edges"></div>
  <div class="stage">
    <img class="logo" src="../../brands/claryon/references/claryon-logogrande.png" alt="Claryon">
    <div class="rule"></div>
    <div class="claim">Automatización + IA<br>para MIPYMEs</div>
    <div class="tagline">Resultados reales. Sin fricción técnica.</div>
  </div>
  <div class="corner">México<span class="dot">·</span>2025</div>
</body>
</html>
