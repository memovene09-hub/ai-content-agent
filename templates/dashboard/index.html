<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: transparent;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* SCRIM de legibilidad — degradado oscuro horneado detrás del texto,
     concentrado en la mitad superior. Garantiza contraste sin importar el fondo. */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(28,20,34,0.78) 0%,
        rgba(28,20,34,0.55) 32%,
        rgba(28,20,34,0.10) 52%,
        rgba(28,20,34,0.0) 66%);
    pointer-events: none;
  }

  .frame {
    position: absolute;
    inset: 0;
    padding: 60px;
  }

  /* CAPA MARCA — top, logo pequeño */
  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 110px;
  }
  .brand-logo {
    height: 110px;
    width: auto;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.8))
            drop-shadow(0 0 22px rgba(0,0,0,0.6));
  }
  .brand-url {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  /* CAPA TIPOGRÁFICA — mitad superior (el celular vive abajo) */
  .type-block {
    position: absolute;
    left: 60px;
    right: 60px;
    top: 250px;
    max-width: 940px;
  }
  .headline {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -2px;
    color: #ffffff;
    text-shadow: 0 4px 28px rgba(0,0,0,0.7);
  }
  .headline .accent {
    color: #bdb9d7;
  }
  .rule {
    width: 80px;
    height: 4px;
    background: #693f8c;
    margin: 48px 0 40px 0;
    box-shadow: 0 0 16px rgba(105,63,140,0.8);
  }
  .sub {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.25;
    letter-spacing: -0.2px;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  .sub .accent {
    color: #693f8c;
  }

  /* CAPA FOOTER */
  .footer {
    position: absolute;
    bottom: 60px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 2px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  }
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="frame">
    <div class="brand-row">
      <img class="brand-logo" src="../../brands/claryon/references/claryon-logogrande.png" alt="Claryon">
      <div class="brand-url">claryon.mx</div>
    </div>

    <div class="type-block">
      <div class="headline">
        Las métricas de tu empresa<br>
        al alcance de tu celular.
      </div>
      <div class="rule"></div>
      <div class="sub">
        Tus datos, <span class="accent">en tiempo real</span>.
      </div>
    </div>

    <div class="footer">
      <div>Claryon · Automatización + IA</div>
      <div>@claryon.mx</div>
    </div>
  </div>
</body>
</html>
